[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# The real DB URL is NOT hardcoded here — env.py pulls it from our own
# app.config.settings (the same .env-based DATABASE_URL the app itself
# uses), so there's exactly one source of truth for the connection
# string, not two that could drift apart.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
